version: "3.8"

services:
  # PostgreSQL Database for Development
  postgres:
    image: postgres:16-alpine
    container_name: bi-election-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: bi_election_dev
      POSTGRES_USER: bi_election_user
      POSTGRES_PASSWORD: dev_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      # Mount init scripts if any
      - ./prisma/init:/docker-entrypoint-initdb.d/
    networks:
      - bi-election-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_election_user -d bi_election_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache for Development
  redis:
    image: redis:7-alpine
    container_name: bi-election-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - bi-election-dev-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bi-election-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bi-election.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - bi-election-dev-network
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  pgadmin_dev_data:
    driver: local

networks:
  bi-election-dev-network:
    driver: bridge
